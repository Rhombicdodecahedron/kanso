name: Release

# Push a tag like v0.2.0 to build a signed Android APK and an unsigned iOS IPA, and publish them
# as a GitHub release together with the AltStore source (altstore.json). Running it by hand
# builds both as workflow artifacts only (no release).
#
# AltStore / SideStore source URL (always the latest release):
#   https://github.com/Rhombicdodecahedron/kanso/releases/latest/download/altstore.json
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./apps/reader/app.json').expo.version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          # grows with every run, so each release installs as an update
          code=$((GITHUB_RUN_NUMBER + 100))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $version (build $code)"

  apk:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KANSO_VERSION: ${{ needs.version.outputs.version }}
      KANSO_VERSION_CODE: ${{ needs.version.outputs.code }}
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kanso.jks"
          {
            echo "KANSO_KEYSTORE_FILE=$RUNNER_TEMP/kanso.jks"
            echo "KANSO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KANSO_KEY_ALIAS=$KEY_ALIAS"
            echo "KANSO_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: apps/reader/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/kanso-${KANSO_VERSION}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/reader/dist/*.apk

  ipa:
    needs: version
    runs-on: macos-26
    timeout-minutes: 90
    env:
      KANSO_VERSION: ${{ needs.version.outputs.version }}
      KANSO_VERSION_CODE: ${{ needs.version.outputs.code }}
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios

      # Unsigned: AltStore / SideStore / Sideloadly sign it on the device with the user's Apple ID.
      - name: Build the app
        run: |
          xcodebuild \
            -workspace ios/Kanso.xcworkspace \
            -scheme Kanso \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40

      - name: Package the IPA
        run: |
          mkdir -p dist/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Kanso.app dist/Payload/
          (cd dist && zip -qry "kanso-${KANSO_VERSION}.ipa" Payload && rm -rf Payload)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: apps/reader/dist/*.ipa

  release:
    needs: [version, apk, ipa]
    # The APK is the minimum; a failed iOS build still publishes Android.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KANSO_VERSION: ${{ needs.version.outputs.version }}
      KANSO_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: AltStore source
        if: ${{ needs.ipa.result == 'success' }}
        run: |
          # keep the versions listed by the current source
          gh release download --repo "$GITHUB_REPOSITORY" --pattern altstore.json --output previous.json 2>/dev/null || true
          ipa="kanso-${KANSO_VERSION}.ipa"
          node .github/scripts/altstore-source.mjs \
            --out dist/altstore.json \
            --previous previous.json \
            --ipa "dist/$ipa" \
            --version "$KANSO_VERSION" \
            --build "$KANSO_VERSION_CODE" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ipa" \
            --notes "See https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        run: |
          ls -lh dist
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          ### Install
          - **Android:** download \`kanso-${KANSO_VERSION}.apk\` below and open it.
          - **iPhone / iPad:** in AltStore or SideStore, add the source
            \`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/altstore.json\`,
            or sideload \`kanso-${KANSO_VERSION}.ipa\` with Sideloadly.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Kanso $KANSO_VERSION" \
            --notes-file "$notes" \
            --generate-notes \
            $([[ "$KANSO_VERSION" == *-* ]] && echo --prerelease)
