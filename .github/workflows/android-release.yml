name: Android release

# Push a tag like v0.2.0 to build a signed APK and publish it as a GitHub release.
# Running it by hand builds the APK as a workflow artifact only (no release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./app.json').expo.version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "KANSO_VERSION=$version" >> "$GITHUB_ENV"
          # grows with every run, so each release installs as an update
          echo "KANSO_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "Building $version (code $((GITHUB_RUN_NUMBER + 100)))"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kanso.jks"
          {
            echo "KANSO_KEYSTORE_FILE=$RUNNER_TEMP/kanso.jks"
            echo "KANSO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KANSO_KEY_ALIAS=$KEY_ALIAS"
            echo "KANSO_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: apps/reader/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/kanso-${KANSO_VERSION}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: kanso-${{ env.KANSO_VERSION }}
          path: apps/reader/dist/*.apk

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Kanso $KANSO_VERSION" \
            --generate-notes \
            $([[ "$KANSO_VERSION" == *-* ]] && echo --prerelease)
